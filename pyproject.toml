[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notif-mgmt"
version = "0.1.0"
description = "Local-first AI notification and relationship CRM"
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
gmail = ["google-api-python-client>=2", "google-auth-oauthlib>=1", "google-auth-httplib2>=0.2"]

[project.scripts]
notif-mgmt = "notif_mgmt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
